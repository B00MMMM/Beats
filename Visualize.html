<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neon Resonance // HUD</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono&display=swap');
    
    :root {
      --accent: #00ff88;
      --bg: #020202;
      --glass: rgba(10, 10, 10, 0.85);
      --border: rgba(255, 255, 255, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    
    html, body { 
      height: 100%; overflow: hidden; background: var(--bg); 
      font-family: 'Space Grotesk', sans-serif; color: #fff;
    }

    /* 3D SCENE CANVAS */
    #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    /* 2D HUD OVERLAY (Bars & Stats) */
    #hud-canvas { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      z-index: 2; pointer-events: none; 
    }

    /* START SCREEN */
    #start-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999;
      background: rgba(0,0,0,0.95); display: flex; flex-direction: column; 
      align-items: center; justify-content: center; transition: opacity 0.5s;
    }
    #start-btn {
      padding: 15px 40px; font-size: 16px; letter-spacing: 0.2em; 
      background: transparent; color: var(--accent); border: 1px solid var(--accent);
      cursor: pointer; text-transform: uppercase; font-weight: bold; border-radius: 4px;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.1); transition: 0.3s;
    }
    #start-btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 40px var(--accent); }

    /* ERROR BOX */
    #error-log {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(40, 0, 0, 0.95); border: 1px solid #ff4444; color: #ffcccc;
      padding: 20px; z-index: 1000; display: none; text-align: center; border-radius: 8px; font-family: monospace;
    }

    /* HEADER */
    header {
      position: absolute; top: 20px; left: 30px; z-index: 10;
      display: flex; gap: 15px; align-items: center; pointer-events: auto;
    }
    h1 { font-size: 14px; font-weight: 700; letter-spacing: 0.1em; color: rgba(255,255,255,0.5); margin-right: 10px; }
    
    #toggleUiBtn {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.6); padding: 5px 12px; border-radius: 15px; font-size: 10px;
      cursor: pointer; transition: 0.2s; text-transform: uppercase;
    }
    #toggleUiBtn:hover { background: rgba(255,255,255,0.15); color: #fff; }

    /* CONTROLS PANEL */
    #controls {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      width: 90%; max-width: 600px; z-index: 10;
      background: var(--glass); backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: 20px;
      padding: 20px; transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s;
    }
    
    /* Auto-Hide Logic */
    body.clean-mode #controls { transform: translate(-50%, 150%); opacity: 0; pointer-events: none; }
    #hover-zone { position: fixed; bottom: 0; left: 0; width: 100%; height: 80px; z-index: 5; }
    body.clean-mode #hover-zone:hover ~ #controls { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }

    /* TABS */
    .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 10px; }
    .tab {
      background: transparent; border: none; color: #666; font-weight: 700;
      padding: 6px 12px; cursor: pointer; text-transform: uppercase; font-size: 10px; letter-spacing: 0.05em;
      border-radius: 4px; transition: 0.2s;
    }
    .tab:hover { color: #aaa; }
    .tab.active { color: #000; background: var(--accent); }

    /* PANELS */
    .panel { display: none; grid-template-columns: 1fr 1fr; gap: 12px; }
    .panel.active { display: grid; }
    .full { grid-column: span 2; }

    label { display: block; font-size: 9px; color: #888; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.05em; }
    input[type=range] { width: 100%; accent-color: var(--accent); background: transparent; cursor: pointer; height: 4px; }
    select { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 6px; border-radius: 6px; font-size: 11px; outline: none; }
    select option { background: #111; }

    /* TOGGLES */
    .toggle-row { 
      display: flex; justify-content: space-between; align-items: center; 
      background: rgba(255,255,255,0.03); padding: 8px 12px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; transition: 0.2s;
    }
    .toggle-row:hover { border-color: rgba(255,255,255,0.1); }
    .t-dot { width: 8px; height: 8px; background: #444; border-radius: 50%; transition: 0.3s; }
    .toggle-row.active .t-dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

    /* PLAYER */
    .player { display: flex; justify-content: center; gap: 15px; margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
    .icon-btn {
      width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15); color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: 0.2s;
    }
    .icon-btn:hover { background: var(--accent); color: #000; transform: scale(1.05); border-color: var(--accent); }
    .icon-btn svg { width: 16px; height: 16px; fill: currentColor; }
  </style>

  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>

  <div id="error-log">
    <h3 style="color:#ff5555; margin-bottom:10px;">System Error</h3>
    <p id="error-msg" style="font-size:12px; opacity:0.8; margin-bottom:15px">Unknown</p>
    <button onclick="location.reload()" style="padding:5px 15px; cursor:pointer;">Reload</button>
  </div>

  <div id="start-screen">
    <button id="start-btn">Initialize System</button>
  </div>

  <canvas id="canvas"></canvas>
  <canvas id="hud-canvas"></canvas>

  <header>
    <h1>Neon Resonance <span style="color:var(--accent)">// HUD</span></h1>
    <button id="toggleUiBtn" style="margin-left:15px;">Hide UI</button>
  </header>

  <div id="hover-zone"></div>

  <div id="controls">
    <div class="tabs">
      <button class="tab active" data-t="visuals">Visuals</button>
      <button class="tab" data-t="camera">Camera</button>
      <button class="tab" data-t="colors">Theme</button>
    </div>

    <div class="panel active" id="visuals">
      <div class="full">
        <label>Core Geometry</label>
        <select id="form">
          <option value="icosahedron">Cyber Icosahedron</option>
          <option value="torusKnot">Infinity Knot</option>
          <option value="sphere">Data Sphere</option>
          <option value="octahedron">Crystal Core</option>
        </select>
      </div>
      <div>
        <label>Luminance</label>
        <input type="range" id="rimPower" min="1" max="5" step="0.1" value="2.5">
      </div>
      <div>
        <label>Particles</label>
        <input type="range" id="particleCount" min="0" max="2000" step="100" value="1000">
      </div>
      <div class="toggle-row active" id="toggleBars">
        <label style="margin:0; cursor:pointer;">Equalizer Bars (HUD)</label>
        <div class="t-dot"></div>
      </div>
      <div class="toggle-row active" id="toggleShock">
        <label style="margin:0; cursor:pointer;">Beat Shockwaves</label>
        <div class="t-dot"></div>
      </div>
    </div>

    <div class="panel" id="camera">
      <div class="full">
        <label>Camera Mode</label>
        <select id="camMode">
          <option value="orbit">Smooth Orbit</option>
          <option value="reactive">Beat Reactive</option>
          <option value="vortex">Vortex Dive</option>
          <option value="cinematic">Cinematic Pan</option>
        </select>
      </div>
      <div>
        <label>Reactivity</label>
        <input type="range" id="sensitivity" min="0.5" max="3" step="0.1" value="1.5">
      </div>
      <div>
        <label>Motion Blur</label>
        <input type="range" id="trail" min="0" max="0.95" step="0.05" value="0.7">
      </div>
    </div>

    <div class="panel" id="colors">
      <div class="full">
        <label>Color Theme</label>
        <select id="theme">
          <option value="neon">Cyber Green</option>
          <option value="magenta">Neon Pink</option>
          <option value="cyan">Tron Blue</option>
          <option value="gold">Luxury Gold</option>
          <option value="void">Deep Space</option>
        </select>
      </div>
      <div class="full">
        <label>Bloom Strength</label>
        <input type="range" id="bloom" min="0" max="3" step="0.1" value="1.5">
      </div>
    </div>

    <div class="player">
      <label class="icon-btn" title="Load Audio">
        <input type="file" id="fileIn" style="display:none" accept="audio/*">
        <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5z"/></svg>
      </label>
      <button class="icon-btn" id="playBtn">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="icon-btn" id="fsBtn">
        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>
    </div>
  </div>

  <audio id="audio" crossorigin="anonymous"></audio>

  <script>
    window.onerror = function(msg, url, line) {
      document.getElementById('start-screen').style.display = 'none';
      const log = document.getElementById('error-log');
      log.style.display = 'block';
      document.getElementById('error-msg').innerText = msg;
      return false; 
    };
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { AfterimagePass } from 'three/addons/postprocessing/AfterimagePass.js';

    // --- CONFIG ---
    const cfg = {
      form: 'icosahedron', rimPower: 2.5, pCount: 1000,
      showBars: true, showShock: true, camMode: 'orbit',
      sensitivity: 1.5, trail: 0.7, theme: 'neon', bloom: 1.5
    };

    const themes = {
      neon: { p: '#00ff88', s: '#004411', bg: '#020502' },
      magenta: { p: '#ff00ff', s: '#440044', bg: '#050205' },
      cyan: { p: '#00ffff', s: '#004444', bg: '#020505' },
      gold: { p: '#ffcc00', s: '#553300', bg: '#0a0800' },
      void: { p: '#ffffff', s: '#444444', bg: '#000000' }
    };

    // --- SETUP ---
    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance", canvas: document.getElementById('canvas') });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.autoClear = false;

    // HUD Canvas
    const hudCanvas = document.getElementById('hud-canvas');
    const ctx = hudCanvas.getContext('2d');
    
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020502, 0.02);
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 500);
    camera.position.set(0, 5, 35);

    // --- AUDIO ---
    const audioEl = document.getElementById('audio');
    let audCtx, analyser, dataArray;
    let audioData = { bass: 0, mid: 0, high: 0, vol: 0, bpm: 0 };

    function initAudio() {
      if(audCtx) return;
      audCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = audCtx.createMediaElementSource(audioEl);
      analyser = audCtx.createAnalyser();
      analyser.fftSize = 256;
      src.connect(analyser);
      analyser.connect(audCtx.destination);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
    }

    // --- GEOMETRY ---
    const coreGroup = new THREE.Group();
    scene.add(coreGroup);

    const rimMat = new THREE.ShaderMaterial({
      uniforms: { color: { value: new THREE.Color(themes.neon.p) }, power: { value: 2.5 }, bias: { value: 1.5 } },
      vertexShader: `varying vec3 vN, vV; void main() { vN = normalize(normalMatrix * normal); vec4 p = modelViewMatrix * vec4(position, 1.0); vV = -p.xyz; gl_Position = projectionMatrix * p; }`,
      fragmentShader: `uniform vec3 color; uniform float power, bias; varying vec3 vN, vV; void main() { float r = 1.0 - max(dot(normalize(vV), normalize(vN)), 0.0); gl_FragColor = vec4(color, pow(r, power) * bias); }`,
      transparent: true, blending: THREE.AdditiveBlending, side: THREE.FrontSide
    });

    let coreMesh, wireMesh;
    function buildCore() {
      if(coreMesh) coreGroup.remove(coreMesh);
      if(wireMesh) coreGroup.remove(wireMesh);
      let geo;
      switch(cfg.form) {
        case 'icosahedron': geo = new THREE.IcosahedronGeometry(7, 2); break;
        case 'torusKnot': geo = new THREE.TorusKnotGeometry(5, 1.5, 128, 32); break;
        case 'sphere': geo = new THREE.SphereGeometry(7, 48, 48); break;
        case 'octahedron': geo = new THREE.OctahedronGeometry(8, 0); break;
      }
      coreMesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x000000 }));
      coreMesh.add(new THREE.Mesh(geo, rimMat));
      wireMesh = new THREE.LineSegments(new THREE.WireframeGeometry(geo), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.1 }));
      coreGroup.add(coreMesh); coreGroup.add(wireMesh);
    }

    // Particles
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(3000 * 3);
    for(let i=0; i<3000; i++) {
       const r = 10 + Math.random() * 40;
       const theta = Math.random() * Math.PI * 2;
       const phi = Math.acos(2 * Math.random() - 1);
       pPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
       pPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
       pPos[i*3+2] = r * Math.cos(phi);
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const pMesh = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.1, color: 0xffffff, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending }));
    scene.add(pMesh);

    // Shockwaves
    const shocks = [];
    const sGeo = new THREE.RingGeometry(14, 15, 64); sGeo.rotateX(-Math.PI/2);
    function spawnShock() {
      if(!cfg.showShock) return;
      const m = new THREE.Mesh(sGeo, new THREE.MeshBasicMaterial({ color: themes[cfg.theme].p, transparent: true, opacity: 0.8, side: THREE.DoubleSide }));
      m.position.y = -8; scene.add(m); shocks.push({ m, age: 0 });
    }

    // Stars
    const sG = new THREE.BufferGeometry();
    const sP = []; for(let i=0; i<2000; i++) sP.push((Math.random()-0.5)*400, (Math.random()-0.5)*400, (Math.random()-0.5)*400);
    sG.setAttribute('position', new THREE.Float32BufferAttribute(sP, 3));
    scene.add(new THREE.Points(sG, new THREE.PointsMaterial({color: 0xffffff, size: 0.3, transparent: true, opacity: 0.6})));

    // --- POST PROCESSING ---
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    composer.addPass(bloom);
    const after = new AfterimagePass(); after.uniforms['damp'].value = 0.7; composer.addPass(after);

    // --- 2D HUD DRAW ---
    function drawHUD() {
      ctx.clearRect(0, 0, hudCanvas.width, hudCanvas.height);
      const theme = themes[cfg.theme];
      
      // STATS
      if(audioData.vol > 0.01) {
        ctx.textAlign = 'right'; ctx.font = 'bold 36px "Space Mono", monospace'; ctx.fillStyle = theme.p;
        ctx.fillText(audioData.bpm + " BPM", hudCanvas.width - 40, 60);
        ctx.font = '11px "Space Mono", monospace'; ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillText("ENERGY: " + Math.round(audioData.vol * 100) + "%", hudCanvas.width - 40, 80);
      }

      // BARS
      if(cfg.showBars && analyser) {
        const bars = 64;
        const barW = hudCanvas.width / bars;
        for(let i=0; i<bars; i++) {
           const idx = Math.floor((i/bars) * (dataArray.length * 0.7));
           const val = dataArray[idx] / 255.0;
           const h = val * (hudCanvas.height * 0.3); 
           ctx.fillStyle = theme.p; ctx.globalAlpha = 0.8;
           ctx.fillRect(i * barW, hudCanvas.height - h, barW - 2, h);
        }
        ctx.globalAlpha = 1.0;
      }
    }

    // --- LOOP ---
    let time = 0, lastBeat = 0;
    function animate() {
      requestAnimationFrame(animate);
      time += 0.01;
      
      if(analyser) {
        analyser.getByteFrequencyData(dataArray);
        let s = 0; for(let i=0; i<dataArray.length; i++) s += dataArray[i];
        audioData.vol = s / (dataArray.length * 255);
        audioData.bass = dataArray[4] / 255; // Approx bass
        
        const now = performance.now();
        if(audioData.bass > 0.7 && (now - lastBeat > 250)) {
           const d = now - lastBeat; lastBeat = now;
           if(d < 2000) audioData.bpm = Math.round(60000 / d);
           spawnShock();
        }
      }

      const S = cfg.sensitivity, E = audioData.vol * S;
      if(coreGroup) {
         coreGroup.rotation.y += 0.005 + E * 0.02;
         coreGroup.scale.setScalar(1 + audioData.bass * 0.4 * S);
      }
      
      for(let i=shocks.length-1; i>=0; i--) {
        const s = shocks[i]; s.age += 0.02; s.m.scale.setScalar(1 + s.age * 8); s.m.material.opacity = 1 - s.age;
        if(s.age >= 1) { scene.remove(s.m); shocks.splice(i, 1); }
      }
      pMesh.rotation.y = time * 0.05;

      const R = 35;
      if(cfg.camMode === 'orbit') { camera.position.set(Math.cos(time*0.2)*R, 5+Math.sin(time*0.1)*5, Math.sin(time*0.2)*R); camera.lookAt(0,0,0); }
      else if(cfg.camMode === 'reactive') { const d = R - audioData.bass*15; camera.position.set(Math.cos(time*0.3)*d, 0, Math.sin(time*0.3)*d); camera.lookAt(0,0,0); }
      
      renderer.clear();
      composer.render();
      drawHUD();
    }

    // --- EVENTS (SAFE) ---
    function safeBind(id, evt, fn) {
      const el = document.getElementById(id);
      if(el) el.addEventListener(evt, fn);
    }
    
    function applyTheme() {
      const t = themes[cfg.theme];
      scene.fog.color.set(t.bg);
      document.documentElement.style.setProperty('--accent', t.p);
      document.documentElement.style.setProperty('--bg', t.bg);
      rimMat.uniforms.color.value.set(t.p);
    }

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      hudCanvas.width = window.innerWidth;
      hudCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Init Logic
    safeBind('start-btn', 'click', () => {
       document.getElementById('start-screen').style.opacity = 0;
       setTimeout(() => document.getElementById('start-screen').remove(), 500);
       initAudio(); buildCore(); animate();
    });

    safeBind('fileIn', 'change', e => { if(e.target.files[0]) { initAudio(); audioEl.src = URL.createObjectURL(e.target.files[0]); audioEl.play(); } });
    safeBind('playBtn', 'click', () => { if(audioEl.paused) audioEl.play(); else audioEl.pause(); });
    
    // Config Bindings
    safeBind('form', 'input', e => { cfg.form = e.target.value; buildCore(); });
    safeBind('rimPower', 'input', e => { cfg.rimPower = parseFloat(e.target.value); rimMat.uniforms.power.value = cfg.rimPower; });
    safeBind('camMode', 'input', e => cfg.camMode = e.target.value);
    safeBind('sensitivity', 'input', e => cfg.sensitivity = parseFloat(e.target.value));
    safeBind('trail', 'input', e => { cfg.trail = parseFloat(e.target.value); after.uniforms['damp'].value = cfg.trail; });
    safeBind('theme', 'input', e => { cfg.theme = e.target.value; applyTheme(); });
    safeBind('bloom', 'input', e => { cfg.bloom = parseFloat(e.target.value); bloom.strength = cfg.bloom; });
    safeBind('toggleBars', 'click', function() { this.classList.toggle('active'); cfg.showBars = !cfg.showBars; });
    safeBind('toggleShock', 'click', function() { this.classList.toggle('active'); cfg.showShock = !cfg.showShock; });

    // UI Toggle
    const toggleUi = (force) => {
       const body = document.body;
       const btn = document.getElementById('toggleUiBtn');
       if(force !== undefined ? force : !body.classList.contains('clean-mode')) {
          body.classList.add('clean-mode'); btn.innerText = "Show UI";
       } else {
          body.classList.remove('clean-mode'); btn.innerText = "Hide UI";
       }
    };
    safeBind('toggleUiBtn', 'click', () => toggleUi());
    safeBind('fsBtn', 'click', () => { 
       if(!document.fullscreenElement) { document.documentElement.requestFullscreen(); toggleUi(true); } 
       else { document.exitFullscreen(); toggleUi(false); }
    });

    // Tab Logic
    document.querySelectorAll('.tab').forEach(b => {
       b.addEventListener('click', e => {
          document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
          document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
          e.target.classList.add('active');
          document.getElementById(e.target.dataset.t).classList.add('active');
       });
    });

  </script>
</body>
</html>
